name: CI

# Runs on every PR, and on main as a safety net for anything pushed directly.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run already in flight — no point
# spending minutes verifying a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Lint / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` not `npm install`: installs exactly what package-lock.json
      # pins, and fails if the lockfile and package.json disagree. CI should
      # build the dependency tree you committed, never resolve a fresh one.
      - run: npm ci

      # Next caches compiled output in .next/cache. Restoring it between runs
      # means only changed modules recompile — the same trick Vercel uses on
      # its own builders.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Typecheck
        run: npx tsc --noEmit

      # Currently 37 errors (31 of them @typescript-eslint/no-explicit-any), so
      # this reports without failing the run. A permanently red pipeline is worse
      # than no pipeline — it teaches everyone to ignore the X. Delete the
      # continue-on-error line once the backlog is cleared and lint becomes a
      # real gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # These only need to *exist* for the build to compile. Every route in
          # this app is dynamic, so nothing queries Supabase or Stripe while
          # building — but lib/stripe.ts constructs its client at module scope
          # and throws on an absent key, which would fail the build here.
          # Real values live in Vercel, which does the actual deploy.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY: re_placeholder
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          CRON_SECRET: placeholder
